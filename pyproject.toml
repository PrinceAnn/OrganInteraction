[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indnet"
version = "0.1.0"
description = "Build association networks from continuous traits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
plots = [
  "matplotlib>=3.7",
  "networkx>=3.1",
]

[project.scripts]
indnet = "indnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
